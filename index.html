<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полиглот — английский и китайский</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">

<meta name="theme-color" content="#4f46e5">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Полиглот">

<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#22201b; --mut:#8a8577; --line:#e7e2d8;
  --acc:#4f46e5; --acc2:#4338ca; --en:#2563eb; --zh:#d9483b;
  --ok:#15803d; --bad:#dc2626; --gold:#d97706;
  --r:16px; --sh:0 1px 3px rgba(30,25,10,.08),0 4px 14px rgba(30,25,10,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
#app{max-width:720px;margin:0 auto;padding:14px 14px 48px;
  padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(48px,env(safe-area-inset-bottom));
  padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.hanzi{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","Source Han Sans SC",sans-serif}
h1,h2,h3{line-height:1.2;margin:.35em 0} h1{font-size:24px} h2{font-size:19px}
.muted{color:var(--mut)} .small{font-size:13px} .big{font-size:20px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:10px}
.cols2{grid-template-columns:repeat(2,1fr)}
.cols3{grid-template-columns:repeat(2,1fr)}
@media(min-width:560px){.cols3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;
  padding:13px 18px;font-size:17px;font-weight:600;background:var(--acc);color:#fff;cursor:pointer;
  box-shadow:var(--sh);transition:transform .06s ease;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.big{width:100%;padding:18px;font-size:19px}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.gr{background:var(--ok)} .btn.rd{background:var(--bad)} .btn.bl{background:var(--en)}
.btn.yl{background:var(--gold)} .btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.chip.on-en{border-color:var(--en);color:var(--en);background:#eff6ff}
.chip.on-zh{border-color:var(--zh);color:var(--zh);background:#fef2f2}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.logo{font-size:20px;font-weight:800;letter-spacing:.2px}
.spacer{flex:1}
.statrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stat{background:var(--card);border-radius:12px;box-shadow:var(--sh);padding:8px 12px;font-size:14px;font-weight:600}
.deck{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);
  box-shadow:var(--sh);padding:12px 14px;cursor:pointer;border:1.5px solid transparent}
.deck .ic{font-size:30px}
.deck .ttl{font-weight:700}
.deck .pr{margin-top:2px;font-size:12px;color:var(--mut)}
.deck.zh{border-left:5px solid var(--zh)} .deck.en{border-left:5px solid var(--en)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.flash{position:relative;text-align:center;padding:26px 14px;min-height:300px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:8px;cursor:pointer;user-select:none}
.flash .emoji{font-size:54px}
.flash .word{font-size:40px;font-weight:800}
.flash .pinyin{font-size:22px;color:var(--mut)}
.flash .ru{font-size:30px;font-weight:700;color:var(--acc2)}
.flash .note{font-size:13px;color:var(--mut)}
.spk{border:0;background:#eef2ff;color:var(--acc2);border-radius:999px;width:46px;height:46px;font-size:20px;
  cursor:pointer;box-shadow:var(--sh)}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;justify-content:center;min-height:58px;padding:10px;font-size:19px;font-weight:600;
  background:var(--card);border:2px solid var(--line);border-radius:14px;cursor:pointer;text-align:center}
.opt.ok{border-color:var(--ok);background:#f0fdf4;color:var(--ok)}
.opt.no{border-color:var(--bad);background:#fef2f2;color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.tile{padding:10px 14px;font-size:18px;font-weight:700;background:var(--card);border:2px solid var(--line);
  border-radius:12px;cursor:pointer;box-shadow:var(--sh)}
.tile.ok{border-color:var(--ok);background:#f0fdf4}
.tile.no{border-color:var(--bad);background:#fef2f2}
.tile.used{opacity:.25;pointer-events:none}
.ansline{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  border:2px dashed var(--line);border-radius:14px;padding:8px;margin-top:8px}
.tonebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.tonebtn{font-size:26px;font-weight:800;padding:14px 0;background:var(--card);border:2px solid var(--line);
  border-radius:14px;cursor:pointer}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(min-width:560px){.kgrid{grid-template-columns:repeat(4,1fr)}}
.kcard{background:var(--card);border-radius:20px;box-shadow:var(--sh);aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;cursor:pointer;border:2px solid transparent}
.kcard .em{font-size:52px} .kcard .wd{font-size:15px;font-weight:700}
.kcard:active{transform:scale(.95);border-color:var(--acc)}
.pop{animation:pop .35s ease} @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.shake{animation:shake .3s} @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.select,.input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;
  font-family:inherit;background:var(--card);color:var(--ink)}
.hint{background:#fffbeb;border:1.5px solid #fde68a;border-radius:12px;padding:12px;font-size:14px;margin:10px 0}
.setrow{margin:14px 0} .setrow label{display:block;font-weight:700;margin-bottom:6px;font-size:14px}
.badge{display:inline-block;background:#f5f3ff;color:var(--acc2);border-radius:999px;padding:4px 10px;
  font-size:13px;font-weight:700;margin:2px}
.gameIcon{font-size:30px} .gameName{font-weight:700;font-size:15px} .gameDesc{font-size:12px;color:var(--mut);margin-top:2px}
.gbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--card);border-radius:var(--r);
  box-shadow:var(--sh);padding:14px;cursor:pointer;text-align:left;border:1.5px solid transparent}
.gbtn:active{border-color:var(--acc)}
.gx{margin-top:12px;text-align:left;background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.7}
.grule{font-size:19px;font-weight:700;color:var(--acc2);text-align:center;line-height:1.4}
.dots::after{content:"…";animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}
hr{border:0;border-top:1.5px solid var(--line);margin:18px 0}
a{color:var(--acc)}
</style>
</head>

/* ---------- СОСТОЯНИЕ (localStorage) ---------- */
const LS="polyglot_v1", DAY=86400000;
const AVATARS=["👤","👩","👨","🧒","👶","🦊","🐼","🐯","🦁","🐨","🐸","🦄"];
let P=loadState();
function loadState(){
  try{const d=JSON.parse(localStorage.getItem(LS));if(d&&d.pr&&d.pr.length)return d}catch(e){}
  return {cur:0,tip:0,pr:[{n:"Профиль 1",a:"👤"},{n:"Профиль 2",a:"👤"},{n:"Ребёнок",a:"🧒"},{n:"Малыш",a:"👶"}],st:{}};
}
function save(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}}
function st(){
  const i=P.cur;
  if(!P.st[i])P.st[i]={c:{},strk:{d:0,n:0},lang:"zh",set:{rate:0.9,per:5,v:{}}};
  const s=P.st[i];
  if(!s.set)s.set={rate:0.9,per:5,v:{}};
  if(!s.strk)s.strk={d:0,n:0};
  if(!s.c)s.c={};
  if(!s.lang)s.lang="zh";
  return s;
}

/* ---------- ПОМОЩНИКИ ---------- */
function $(id){return document.getElementById(id)}
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a,n){const c=a.slice();const out=[];while(out.length<n&&c.length)out.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);return out}
function today0(){const d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function wordList(lang,deckId){
  const out=[];
  DATA[lang].decks.forEach(function(d){
    if(deckId&&d.id!==deckId)return;
    d.words.forEach(function(w,i){out.push({r:w.r,w:w.w,p:w.p||"",e:w.e||"",x:w.x||"",ph:!!d.ph,gr:!!d.gr,deck:d.id,dt:d.t,cid:d.id+":"+i})});
  });
  return out;
}
function cardOf(cid){return st().c[cid]}

/* ---------- ИНТЕРВАЛЬНОЕ ПОВТОРЕНИЕ (SM-2 упрощённый) ---------- */
/* g: 0 = сложно, 1 = норм, 2 = легко */
function rate(cid,g){
  const s=st();
  const c=s.c[cid]||(s.c[cid]={e:2.5,i:0,r:0,l:0,d:0});
  const now=Date.now();
  if(g===0){c.e=Math.max(1.3,c.e-0.2);c.l++;c.i=0;c.d=now+60000;save();return}
  if(c.i===0){c.i=(g===2)?3:1}
  else if(g===1){c.i=Math.max(1,Math.round(c.i*c.e))}
  else if(g===2){c.e=Math.min(3.2,c.e+0.1);c.i=Math.max(1,Math.round(c.i*c.e*1.25))}
  c.i=Math.min(c.i,180);c.r++;c.d=now+c.i*DAY;
  save();
}
function weaken(cid){ /* ошибка в игре: слово скоро вернётся в урок */
  const c=st().c[cid];if(!c)return;
  c.l++;c.i=Math.max(1,Math.floor(c.i/2));c.d=Date.now();save();
}
function isDue(w){const c=st().c[w.cid];return !!c&&c.d<=Date.now()}
function isLearned(w){const c=st().c[w.cid];return !!c&&c.r>0&&c.i>=1}
function bumpStreak(){
  const t=today0(),s=st().strk;
  if(s.d===t)return;
  s.n=(s.d===t-DAY)?s.n+1:1;s.d=t;save();
}
function buildQueue(lang,deckId){
  const s=st();
  const scope=deckId?wordList(lang,deckId):wordList(lang);
  const due=scope.filter(isDue);
  const fresh=scope.filter(function(w){return !st().c[w.cid]}).slice(0,s.set.per);
  return due.concat(fresh);
}
function badgesHtml(n){
  let h="";for(let k=25;k<=n;k+=25)h+='<span class="badge">🏅 '+k+' слов</span> ';return h;
}

/* ---------- ОЗВУЧКА (Web Speech API) ---------- */
let VOICES=[];
function refreshVoices(){try{VOICES=window.speechSynthesis?speechSynthesis.getVoices():[]}catch(e){VOICES=[]}}
if(window.speechSynthesis){
  refreshVoices();
  speechSynthesis.onvoiceschanged=function(){refreshVoices();if(CUR.v==="home"||CUR.v==="settings")render()};
}
function voicesFor(lang){const want=lang==="zh"?"zh":(lang==="ru"?"ru":"en");return VOICES.filter(function(v){return (v.lang||"").toLowerCase().indexOf(want)===0})}
function pickVoice(lang){
  const pref=st().set.v[lang];
  if(pref){const v=VOICES.filter(function(x){return x.name===pref})[0];if(v)return v}
  return voicesFor(lang)[0]||null;
}
function say(text,lang){
  if(!window.speechSynthesis)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang==="zh"?"zh-CN":(lang==="ru"?"ru-RU":"en-US");
    const v=pickVoice(lang);if(v)u.voice=v;
    u.rate=Number(st().set.rate)||0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function zhMissing(){return voicesFor("zh").length===0}

/* ---------- ТОНЫ (по диакритике пиньиня) ---------- */
const TONES={"ā":1,"á":2,"ǎ":3,"à":4,"ē":1,"é":2,"ě":3,"è":4,"ī":1,"í":2,"ǐ":3,"ì":4,
             "ō":1,"ó":2,"ǒ":3,"ò":4,"ū":1,"ú":2,"ǔ":3,"ù":4,"ǖ":1,"ǘ":2,"ǚ":3,"ǜ":4};
function toneOf(pinyin){
  const first=(pinyin||"").trim().split(/\s+/)[0]||"";
  for(const ch of first){if(TONES[ch])return TONES[ch]}
  return 0;
}
const TONE_MARKS={1:"ˉ",2:"´",3:"ˇ",4:"`"};

  if(v!=="audio")audioStop();
  if(v!=="play"&&G&&G.rec){try{G.rec.abort()}catch(e){}}
  CUR={v:v,a:a};render();
}

  if(CUR.v==="home")viewHome(app);

  else if(CUR.v==="done")viewDone(app);

let LSN=null;
function startLesson(deckId){
  const lang=st().lang;
  const q=buildQueue(lang,deckId);
  if(!q.length){alert("Повторять нечего: новые слова этого курса появятся завтра. Загляните в другую тему!");return}
  LSN={q:q,i:0,deck:deckId||null,shown:0,good:0,bad:0,rev:0,spoken:0};
  go("lesson");
}
function findWord(cid,lang){
  const i=cid.lastIndexOf(":");
  const dk=DATA[lang].decks.filter(function(x){return x.id===cid.slice(0,i)})[0];
  if(!dk)return null;
  const w=dk.words[+cid.slice(i+1)];
  return w?Object.assign({gr:!!dk.gr,ph:!!dk.ph},w):null;
}
function sayCard(cid,lang){
  const w=findWord(cid,lang);if(!w)return;
  if(w.gr){
    if(lang==="zh"){const m=(w.x||"").match(/[一-鿿]+/g);if(m)say(m[0],lang)}
    else{const f=(w.x||"").split("\n")[0];if(f)say(f,lang)}
    return;
  }
  say(w.w,lang);
}

/* ---------- ТРЕНАЖЁР ПРОИЗНОШЕНИЯ (микрофон) ---------- */
function recOk(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function prRec(){
  const S=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!S){alert("Этот браузер не умеет распознавать речь. Откройте приложение в Chrome на телефоне или в Edge.");return}
  if(!G)return;
  const w=G.qs[G.i];
  const rec=new S();
  G.rec=rec;G.prState="run";render();
  rec.lang=G.lang==="zh"?"zh-CN":"en-US";
  rec.interimResults=false;rec.maxAlternatives=4;
  rec.onresult=function(ev){
    const res=ev.results[ev.results.length-1];
    const alts=[];
    for(let k=0;k<res.length;k++)alts.push(res[k].transcript);
    G.heard=alts[0]||"";
    const ok=alts.some(function(a){return prMatch(a,w.w)});
    G.prState=ok?"ok":"no";
    if(ok)G.ok++;
    else{G.bad++;if(!G.prScored){weaken(w.cid);G.prScored=1}}
    render();
  };
  rec.onerror=function(){G.prState="no";G.heard="(микрофон не услышал — проверьте разрешение)";render()};
  try{rec.start()}catch(e){G.prState=null;render()}
}
function prMatch(a,t){
  const n=function(s){return (s||"").toLowerCase().replace(/[^a-z0-9一-鿿]/g,"")};
  const A=n(a),T=n(t);
  if(!A||!T)return false;
  if(G.lang==="zh")return A.indexOf(T)>=0||T.indexOf(A)>=0;
  return A===T||(T.length>=4&&A.indexOf(T)>=0);
}

    {id:"au",ic:"👂",n:"Послушай и выбери",d:"Слышишь слово — найди его на экране",
     ok:words.length>=4&&voicesFor(lang).length>0},
    {id:"pr",ic:"🎙️",n:"Скажи слово",d:"Произнеси в микрофон — телефон проверит",
     ok:words.length>=4&&recOk()},
    {id:"mt",ic:"🀄",n:"Найди пары",d:"Соедини слово и перевод — 6 пар",ok:words.length>=6}
  ];
  if(zh){
    games.push({id:"py",ic:"🧩",n:"Собери пиньиня",d:"Слоги — в правильном порядке",
      ok:words.filter(function(w){return w.p.trim().split(/\s+/).length>=2}).length>=4});
    games.push({id:"tn",ic:"🎵",n:"Какой тон?",d:"ˉ ´ ˇ ` — выбери тон слога",
      ok:words.filter(function(w){return toneOf(w.p)>0&&w.p.trim().split(/\s+/).length===1}).length>=4});
  }else{
    games.push({id:"lt",ic:"🔤",n:"Собери слово",d:"Буквы — в правильном порядке",
      ok:words.filter(function(w){return w.w.length>=3&&w.w.length<=10&&w.w.indexOf(" ")<0}).length>=4});
  }
  games.push({id:"ph",ic:"💬",n:"Собери фразу",d:"Слова фразы — по порядку",ok:phrases.length>=3});
  let h=topbar()+"<h1>🎮 Игры — "+DATA[lang].name.toLowerCase()+"</h1>";
  if(intro.length<4)h+='<div class="hint">Игры откроются, когда вы выучите первые слова (нужно хотя бы 4 слова в уроках).</div>';
  h+='<div class="grid cols2">';
  games.forEach(function(g){
    h+='<div class="gbtn"'+(g.ok?' onclick="startGame(\''+g.id+'\')"':' style="opacity:.45"')+'>'
      +'<div class="gameIcon">'+g.ic+'</div><div><div class="gameName">'+g.n+'</div><div class="gameDesc">'+g.d+"</div>"
      +(g.ok?"":'<div class="gameDesc" style="color:var(--bad)">пока мало слов</div>')+"</div></div>";
  });
  h+="</div>";
  app.innerHTML=h;
}

/* ---------- ИГРЫ: движок ---------- */
let G=null;
function startGame(id){
  const lang=st().lang;
  const intro=wordList(lang).filter(function(w){return st().c[w.cid]});
  const words=intro.filter(function(w){return !w.ph&&!w.gr});
  const phrases=intro.filter(function(w){return w.ph});
  if(id==="mt"){
    if(words.length<6){alert("Нужно хотя бы 6 выученных слов.");return}
    const pairs=pick(words,Math.min(6,words.length));
    const tiles=[];
    pairs.forEach(function(w,i){
      tiles.push({pid:i,cid:w.cid,txt:w.w,side:0,done:false});
      tiles.push({pid:i,cid:w.cid,txt:w.r,side:1,done:false});
    });
    G={id:"mt",lang:lang,pairs:pairs,tiles:shuffle(tiles),open:[],found:0,bad:0,lock:false};
    go("match");
    return;
  }
  let pool=null;
  if(id==="t1"||id==="t2"||id==="au"||id==="pr")pool=words;
  else if(id==="py")pool=words.filter(function(w){return w.p.trim().split(/\s+/).length>=2});
  else if(id==="tn")pool=words.filter(function(w){return toneOf(w.p)>0&&w.p.trim().split(/\s+/).length===1});
  else if(id==="lt")pool=words.filter(function(w){return w.w.length>=3&&w.w.length<=10&&w.w.indexOf(" ")<0});
  else if(id==="ph")pool=phrases;
  if(!pool||pool.length<3){alert("Пока не хватает слов для этой игры.");return}
  G={id:id,lang:lang,qs:pick(pool,Math.min(10,pool.length)),i:0,ok:0,bad:0,lock:false,opts:null,asm:null,prState:null,heard:"",prScored:0};
  go("play");
}
function nextRound(){if(!G)return;G.i++;G.lock=false;G.opts=null;G.prState=null;G.heard="";G.prScored=0;render()}
function gameHeader(w){
  let h='<div class="between"><div class="muted small">Вопрос '+(G.i+1)+" / "+G.qs.length+'</div>'
    +'<button class="btn sm ghost" onclick="go(\'games\')">Выйти</button></div>'
    +'<div class="bar" style="margin:8px 0 12px"><i style="width:'+Math.round(100*G.i/G.qs.length)+'%"></i></div>';
  return h;
}
function makeOpts(w,valFn){
  const right=valFn(w);
  const same=wordList(G.lang).filter(function(x){return x.cid!==w.cid&&!x.gr&&!!x.ph===!!w.ph&&valFn(x)!==right});
  return shuffle([{v:right,ok:true}].concat(pick(same,3).map(function(x){return {v:valFn(x),ok:false}})));
}
function optsHtml(arr,hanzi){
  let h='<div class="grid cols2" style="margin-top:12px">';
  arr.forEach(function(o,i){
    h+='<div class="opt'+(hanzi?" hanzi":"")+'" id="op'+i+'" onclick="optTap('+i+')">'+esc(o.v)+"</div>";
  });
  return h+"</div>";
}
function optTap(i){
  if(!G||G.lock)return;G.lock=true;
  const w=G.qs[G.i],o=G.opts[i];
  const el=$("op"+i);if(el)el.classList.add(o.ok?"ok":"no");
  if(o.ok){G.ok++}
  else{
    G.bad++;weaken(w.cid);
    G.opts.forEach(function(x,k){if(x.ok){const e=$("op"+k);if(e)e.classList.add("ok")}});
  }
  setTimeout(nextRound,o.ok?700:1500);
}

/* ---------- ИГРЫ: экран раунда ---------- */
function viewPlay(app){
  if(!G){go("games");return}
  if(G.i>=G.qs.length){viewGameDone(app);return}
  const w=G.qs[G.i],lang=G.lang,zh=lang==="zh";
  let h=topbar()+gameHeader(w)+'<div class="card">';
  if(G.id==="t1"){
    h+='<div class="center">'+(w.e?'<div class="emoji">'+w.e+"</div>":"")
      +'<div class="word'+(zh?" hanzi":"")+'" style="font-size:34px">'+esc(w.w)+"</div>"
      +(zh?'<div class="pinyin">'+esc(w.p)+"</div>":"")
      +'<button class="spk" style="margin-top:6px" onclick="sayCard(\''+w.cid+"','"+lang+'\')">🔊</button></div>';
    G.opts=makeOpts(w,function(x){return x.r});
    h+=optsHtml(G.opts,false);
  }else if(G.id==="t2"){
    h+='<div class="center"><div class="word" style="font-size:30px">'+esc(w.r)+"</div>"
      +'<button class="spk" style="margin-top:6px" onclick="sayCard(\''+w.cid+"','"+lang+'\')">🔊</button></div>';
    G.opts=makeOpts(w,function(x){return x.w});
    h+=optsHtml(G.opts,zh);
  }else if(G.id==="au"){
    h+='<div class="center" style="padding:14px 0"><button class="spk" style="width:110px;height:110px;font-size:46px" onclick="sayCard(\''+w.cid+"','"+lang+'\')">🔊</button>'
      +'<div class="muted small" style="margin-top:8px">нажимай, чтобы слушать ещё раз</div></div>';
    G.opts=makeOpts(w,function(x){return x.w});
    h+=optsHtml(G.opts,zh);
  }else if(G.id==="pr"){
    h+='<div class="center">'+(w.e?'<div class="emoji">'+w.e+"</div>":"")
      +'<div class="word'+(zh?" hanzi":"")+'" style="font-size:40px">'+esc(w.w)+"</div>"
      +(zh?'<div class="pinyin">'+esc(w.p)+"</div>":"")
      +'<button class="spk" style="margin-top:6px" onclick="sayCard(\''+w.cid+"','"+lang+'\')">🔊</button></div>';
    if(G.prState==="run"){
      h+='<div class="center big" style="margin-top:16px">🎧 слушаю<span class="dots"></span></div>';
    }else if(G.prState==="ok"||G.prState==="no"){
      h+='<div class="center" style="margin-top:14px"><span class="stat" style="font-size:17px;'+(G.prState==="ok"
        ?"background:#f0fdf4;color:var(--ok)":"background:#fef2f2;color:var(--bad)")+'">'
        +(G.prState==="ok"?"✅ Отлично!":"❌ Услышал: "+esc(G.heard||"—"))+"</span></div>";
      h+='<div class="row" style="margin-top:12px;justify-content:center"><button class="btn ghost" onclick="prRec()">🎙️ Ещё раз</button>'
        +'<button class="btn" onclick="nextRound()">Дальше ▶</button></div>';
    }else{
      h+='<div class="center" style="margin-top:16px"><button class="btn big yl" onclick="prRec()">🎙️ Сказать</button>'
        +'<div class="small muted" style="margin-top:6px">разрешите доступ к микрофону, когда спросит браузер</div></div>';
    }
  }else if(G.id==="tn"){
    const t=toneOf(w.p);
    h+='<div class="center"><div class="word hanzi" style="font-size:56px">'+esc(w.w)+"</div>"
      +'<button class="spk" style="margin:6px 0" onclick="sayCard(\''+w.cid+"','"+lang+'\')">🔊</button>'
      +'<div class="muted">Какой тон у слога <b>'+esc(w.p)+"</b>?</div></div>";
    G.tone=t;
    h+='<div class="tonebtns">';
    for(let k=1;k<=4;k++)h+='<button class="tonebtn" id="tb'+k+'" onclick="toneTap('+k+')">'+k+"<br>"+TONE_MARKS[k]+"</button>";
    h+="</div>";
  }else{
    /* игры-сборки: py (пиньиня), lt (буквы), ph (фраза) */
    if(!G.asm||G.asm.ri!==G.i){
      let parts,sep,hint,question;
      if(G.id==="py"){parts=w.p.trim().split(/\s+/);sep=" ";hint=w.w;question="Собери пиньиня"}
      else if(G.id==="lt"){parts=w.w.toLowerCase().split("");sep="";hint=w.r;question="Собери слово по буквам"}
      else{
        parts=(zh?w.w.split(""):w.w.split(" ")).filter(function(p){return /[a-zA-Zа-яА-Я一-鿿]/.test(p)});
        sep=zh?"":" ";hint=w.r;question="Собери фразу";
      }
      G.asm={ri:G.i,parts:shuffle(parts.slice()),done:[],sep:sep,target:parts.join(sep),hint:hint,q:question};
    }
    const a=G.asm;
    h+='<div class="center"><div class="muted small">'+esc(a.q)+"</div>"
      +'<div class="word'+(zh?" hanzi":"")+'" style="font-size:32px">'+esc(a.hint)+"</div>"
      +'<button class="spk" style="margin:6px 0" onclick="sayCard(\''+w.cid+"','"+lang+'\')">🔊</button></div>';
    h+='<div class="ansline" id="ansline">';
    a.done.forEach(function(p,k){h+='<span class="tile'+(a.state?" "+a.state:"")+'" onclick="asmUntap('+k+')">'+esc(p)+"</span>"});
    if(!a.done.length)h+='<span class="muted small">нажимай на кусочки ниже</span>';
    h+="</div>";
    h+='<div class="tiles">';
    a.parts.forEach(function(p,k){h+='<span class="tile" id="tl'+k+'" onclick="asmTap('+k+')">'+esc(p)+"</span>"});
    h+="</div>";
    if(a.state==="no")h+='<div class="center muted small">Правильно: '+esc(a.target)+"</div>";
  }
  h+="</div>";
  app.innerHTML=h;
  if(G.id==="au"){
    const ri=G.i;
    setTimeout(function(){if(CUR.v==="play"&&G&&G.i===ri&&!G.lock)sayCard(w.cid,G.lang)},350);
  }
}
function toneTap(k){
  if(!G||G.lock)return;G.lock=true;
  const w=G.qs[G.i];
  if(k===G.tone){G.ok++;const e=$("tb"+k);if(e)e.classList.add("ok")}
  else{
    G.bad++;weaken(w.cid);
    const e=$("tb"+k);if(e)e.classList.add("no");
    const g=$("tb"+G.tone);if(g)g.classList.add("ok");
  }
  setTimeout(nextRound,900);
}
function asmTap(i){
  if(!G||G.lock)return;
  const a=G.asm;
  a.done.push(a.parts[i]);a.parts.splice(i,1);a.state="";
  if(!a.parts.length)asmCheck();else render();
}
function asmUntap(k){
  if(!G||G.lock)return;
  const a=G.asm;
  a.parts.push(a.done[k]);a.done.splice(k,1);a.state="";
  render();
}
function asmCheck(){
  const a=G.asm,w=G.qs[G.i];
  if(a.done.join(a.sep)===a.target){a.state="ok";G.ok++;G.lock=true;render();setTimeout(nextRound,850)}
  else{a.state="no";G.bad++;G.lock=true;weaken(w.cid);render();setTimeout(nextRound,2000)}
}
function viewGameDone(app){
  const tot=G.qs?G.qs.length:G.pairs.length;
  let h=topbar();
  h+='<div class="card center" style="padding:30px 16px"><div style="font-size:58px">'+(G.bad===0?"🏆":"🎯")+"</div>"
    +"<h1>"+(G.ok!==undefined?G.ok:G.found)+" из "+tot+"</h1>"
    +'<div class="muted">'+(G.bad===0?"Идеально!":"Ошибок: "+G.bad+" — эти слова вернутся в урок")+"</div></div>";
  h+='<div class="row" style="margin-top:14px"><button class="btn ghost" onclick="startGame(\''+G.id+'\')">🔄 Ещё раз</button>'
    +'<button class="btn ghost" onclick="go(\'games\')">🎮 Другая игра</button>'
    +'<button class="btn" onclick="go(\'home\')">🏠 Домой</button></div>';
  app.innerHTML=h;
}

/* ---------- ИГРА: найди пары ---------- */
function viewMatch(app){
  if(!G||G.id!=="mt"||!G.tiles){go("games");return}
  if(G.found>=G.pairs.length){viewGameDone(app);return}
  let h=topbar();
  h+='<div class="between"><div class="muted small">Найди пары: '+G.found+" / "+G.pairs.length+'</div>'
    +'<button class="btn sm ghost" onclick="go(\'games\')">Выйти</button></div>'
    +'<div class="small muted" style="margin:8px 0">Открой слово и его перевод. Ошибки: '+G.bad+"</div>";
  h+='<div class="grid cols2">';
  G.tiles.forEach(function(t,i){
    const open=G.open.indexOf(i)>=0||t.done;
    const small=t.txt.length>12?' style="font-size:14px"':"";
    h+='<div class="opt'+(open?" ok":"")+(t.side===0&&G.lang==="zh"?" hanzi":"")+'"'+small+' id="mt'+i+'" onclick="matchTap('+i+')">'+(open?esc(t.txt):"❓")+"</div>";
  });
  h+="</div>";
  app.innerHTML=h;
}
function matchTap(i){
  if(!G||G.lock)return;
  if(G.open.indexOf(i)>=0)return;
  const t=G.tiles[i];
  if(t.done)return;
  G.open.push(i);
  if(G.open.length===2){
    const a=G.tiles[G.open[0]],b=G.tiles[G.open[1]];
    if(a.pid===b.pid&&a.side!==b.side){
      a.done=b.done=true;G.found++;G.open=[];
      if(G.found>=G.pairs.length){save();setTimeout(render,700)}
    }else{
      G.bad++;G.lock=true;
      weaken(a.cid);
      setTimeout(function(){G.open=[];G.lock=false;render()},900);
    }
  }
  render();
}

/* ---------- PWA: установка как приложение, офлайн-режим ---------- */
let DEF_PROMPT=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();DEF_PROMPT=e;
  if(CUR.v==="home")render();
});
function doInstall(){
  if(!DEF_PROMPT)return;
  DEF_PROMPT.prompt();
  DEF_PROMPT.userChoice.then(function(){DEF_PROMPT=null;render()});
}
if((location.protocol==="http:"||location.protocol==="https:")&&("serviceWorker" in navigator)){
  try{navigator.serviceWorker.register("sw.js")}catch(e){}
}

/* точка входа */
boot();
